[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-rights-check"
version = "0.1.0"
description = "Spots common traps in German contracts and letters for international students - with verified legal sources."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
